version: 2
updates:
  # Application dependencies (pnpm / npm registry).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels: [dependencies]
    # Production deps are baked into the published standalone bundle, so their
    # bumps must be releasable: commit them as `fix(deps):` (release-please cuts
    # a patch). Dev deps never ship and stay non-releasable `chore(deps-dev):`.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  # GitHub Actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: [github-actions]
    groups:
      github-actions:
        patterns: ["*"]
