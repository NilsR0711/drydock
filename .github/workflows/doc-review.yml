name: Doc Review Reminder

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

# Re-evaluate only the latest push per PR.
concurrency:
  group: doc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-review:
    name: Check for accompanying docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect source-only changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          src_changed=false
          docs_changed=false
          if echo "$changed" | grep -qE '^src/'; then
            src_changed=true
          fi
          if echo "$changed" | grep -qE '^docs/'; then
            docs_changed=true
          fi
          echo "src_changed=$src_changed" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"

      - name: Post or update reminder
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SRC_CHANGED: ${{ steps.diff.outputs.src_changed }}
          DOCS_CHANGED: ${{ steps.diff.outputs.docs_changed }}
          # `head.repo.full_name` differs from the repo for fork PRs, whose
          # GITHUB_TOKEN is read-only. The reminder logic degrades to the job
          # summary in that case so the check stays green (issue #392).
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const modulePath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/doc-review-reminder.mjs`;
            const { default: docReviewReminder } = await import(pathToFileURL(modulePath).href);
            await docReviewReminder({
              github,
              context,
              core,
              srcChanged: process.env.SRC_CHANGED === 'true',
              docsChanged: process.env.DOCS_CHANGED === 'true',
              isFork: process.env.IS_FORK === 'true',
            });
