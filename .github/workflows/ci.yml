name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
        # The daemon lifecycle must behave identically on every OS (issue #216),
        # so the test suite runs on all three. The heavier lint/typecheck/build
        # are OS-independent and run on ubuntu only; macOS/Windows run a single
        # Node version (22) to exercise the cross-platform process handling
        # without doubling the slowest runners.
        exclude:
          - os: macos-latest
            node: "20"
          - os: windows-latest
            node: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build

      # A clean `next build` can still emit a `.next/standalone` bundle that
      # crashes on boot when the file tracer drops a runtime module (issue #209).
      # Boot the real bundle and require it to serve the homepage so a
      # non-booting server is caught here, never after publish.
      - name: Smoke-test standalone server
        if: matrix.os == 'ubuntu-latest'
        run: pnpm smoke
