name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Generous headroom over the slowest matrix leg (ubuntu/Node 22, a few
    # minutes); trips only on a genuine hang, not on normal timing variance.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
        # The daemon lifecycle must behave identically on every OS (issue #216).
        # ubuntu and macOS (both Unix) run the full suite; Windows runs the
        # daemon lifecycle subset, because the legacy suite has Unix-only tests
        # (real `false`/`printenv` spawns, POSIX signal timing) that predate this
        # work and are unrelated to it. The heavier lint/typecheck/build are
        # OS-independent and run on ubuntu only; macOS/Windows run a single Node
        # version (24, the current Active LTS) so the slowest runners don't double.
        exclude:
          - os: macos-latest
            node: "22"
          - os: windows-latest
            node: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: pnpm typecheck

      - name: Test (full suite)
        if: matrix.os != 'windows-latest'
        run: pnpm test

      # Windows runs only the daemon lifecycle subset: the rest of the legacy
      # suite has Unix-only tests (real command spawns, POSIX signals) that are
      # out of scope for issue #216. This still exercises start/stop/status,
      # graceful HTTP shutdown, and stale-state recovery on a real Windows host.
      - name: Test (daemon lifecycle)
        if: matrix.os == 'windows-latest'
        run: pnpm test:daemon

      # Coverage instrumentation (issue #389). Non-blocking for now
      # (`continue-on-error`): it prints a per-file `src/lib/**` summary to the
      # job log and uploads the lcov report, so coverage gaps in critical paths
      # (orchestrator drivers, GitHub integration) become visible without gating
      # merges yet. Runs on a single leg (ubuntu, Node 24) to avoid re-running
      # the full suite across the matrix. Flip `continue-on-error` off once the
      # per-directory thresholds land (see vitest.config.ts).
      - name: Test coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        continue-on-error: true
        run: pnpm test:coverage

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build

      # A clean `next build` can still emit a `.next/standalone` bundle that
      # crashes on boot when the file tracer drops a runtime module (issue #209).
      # Boot the real bundle and require it to serve the homepage so a
      # non-booting server is caught here, never after publish.
      - name: Smoke-test standalone server
        if: matrix.os == 'ubuntu-latest'
        run: pnpm smoke

      # `next build` + package-mcp can emit an MCP bundle that crashes on boot or
      # fails to resolve an externalized runtime module (issue #230). Boot the
      # real bundle and require a full stdio handshake so a non-launching MCP
      # server is caught here, never after publish.
      - name: Smoke-test MCP server
        if: matrix.os == 'ubuntu-latest'
        run: pnpm smoke:mcp
