name: Release Please

# Releases are cut manually: trigger this workflow from the Actions tab (or
# `gh workflow run release-please.yml`) when you want to release. release-please
# then opens/updates a "release" PR with the next version + CHANGELOG entry;
# merging that PR cuts the tag and GitHub release and, via the publish job below,
# publishes to npm — changelog and release produced together, but only when you
# choose to release.
on:
  workflow_dispatch:

# Only one release run at a time; never cancel an in-flight release.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a release is cut, reuse the single publish definition (npm-publish.yml)
  # to push the tag to npm with provenance. Manual/first publishes call the same
  # workflow via workflow_dispatch.
  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The called workflow needs id-token: write for provenance; a reusable-
    # workflow caller must grant it here (capped by this workflow's token),
    # otherwise the run fails at startup validation.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
