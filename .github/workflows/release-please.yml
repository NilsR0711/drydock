name: Release Please

# Releases are cut manually only: trigger this workflow from the Actions tab
# (or `gh workflow run release-please.yml`) to create/update the release PR.
# Merging that PR cuts the tag and GitHub release.
on:
  workflow_dispatch:

# Only one release run at a time; never cancel an in-flight release.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
