name: Release Please

# Releases are cut manually only: trigger this workflow from the Actions tab
# (or `gh workflow run release-please.yml`) to create/update the release PR.
# Merging that PR cuts the tag and GitHub release.
on:
  workflow_dispatch:

# Only one release run at a time; never cancel an in-flight release.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mint an OIDC token so `npm publish --provenance` can attest the build
      # without a long-lived npm token in the repo.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `npm publish` runs the `prepublishOnly` gate (tests + standalone build)
      # before uploading. Provenance links the tarball to this workflow run.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
