name: Publish to npm

# Single source of truth for publishing, and the only workflow registered as an
# npm trusted publisher for @nilsr0711/drydock. Triggered by workflow_dispatch:
# the first release and ad-hoc/recovery publishes run it by hand, and
# release-please.yml dispatches it (with the freshly cut tag as `ref`) after it
# cuts a release. It is deliberately NOT reusable (workflow_call): npm validates
# the workflow that runs the publish, so this must be the one that actually
# runs — being *called* from release-please.yml made that the validated workflow
# and failed auth (ENEEDAUTH).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch) to publish — defaults to the run's ref"
        required: false
        default: ""

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Also governs the reusable call from release-please.yml, whose publish job
    # cannot declare its own timeout-minutes (reusable-workflow-call jobs may not).
    timeout-minutes: 30
    permissions:
      contents: read
      # Mint the OIDC token that npm trusted publishing exchanges for a
      # short-lived registry credential (and that also signs provenance). A
      # reusable-workflow caller must grant this too — see release-please.yml.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # No registry-url here on purpose: actions/setup-node would write an
      # .npmrc with `_authToken=${NODE_AUTH_TOKEN}` and export a placeholder
      # NODE_AUTH_TOKEN. npm treats that placeholder as a (bogus) credential and
      # skips OIDC trusted publishing, failing the upload with E404. With no
      # token set at all, npm >= 11.5.1 falls back to OIDC. The default registry
      # is npmjs, and package.json pins publishConfig.access/provenance.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      # Trusted publishing (OIDC, tokenless) requires npm >= 11.5.1; the npm that
      # ships with Node 22 is 10.x, so upgrade before publishing.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `npm publish` runs the `prepublishOnly` gate (tests + standalone build)
      # before uploading, so a broken build never ships. Auth is via OIDC trusted
      # publishing — no token — and provenance is attached automatically.
      - name: Publish
        run: npm publish --access public
